name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sync-check:
    name: Verify shared skills and runtime variants are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync verification
        shell: bash
        run: bash sync-skills.sh --verify

  lint-skills:
    name: Lint skill metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run skill linter
        shell: bash
        run: bash lint-skills.sh

  decision-logic-tests:
    name: Test workflow decision logic and wf.py I/O shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the offline test suite
        shell: bash
        # Discovery runs every tests/test_*.py module: the pure decision-logic
        # suite plus the wf.py I/O-shell integration tests.
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  version-bump-check:
    name: Check plugin versions are bumped
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bumps for changed plugins
        shell: bash
        run: |
          status=0
          base="${{ github.event.pull_request.base.sha }}"
          for plugin in github-workflow local-workflow; do
            changed=$(git diff --name-only "$base"...HEAD -- "$plugin/" | grep -v '.claude-plugin/plugin.json' | head -1 || true)
            if [ -n "$changed" ]; then
              old_version=$(git show "$base:$plugin/.claude-plugin/plugin.json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
              new_version=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" < "$plugin/.claude-plugin/plugin.json")
              if [ "$old_version" = "$new_version" ]; then
                echo "FAIL: $plugin/ has changes but version is still $old_version — bump it in plugin.json"
                status=1
              else
                echo "OK: $plugin version bumped $old_version → $new_version"
              fi
            fi
          done
          exit $status

  footprint-check:
    name: Check instruction-token footprint budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two checks, because execute's footprint now spans two windows. The
      # tight one protects what this gate was built for — the pick/plan/build
      # path — by excluding the two references that only load once a PR
      # exists. The loose one keeps the whole run bounded. Raising the loose
      # budget alone would have let the build window regrow ~9k tokens
      # unnoticed. Measured 34077 and 44113; budgets are ~2.0% above each.
      #
      # Build window recalibrated from 34800: SKILL.md gained the cross-phase
      # "Fix in scope, file out of scope" rule, which decides what happens to
      # every problem the run finds and so has to sit in this window rather
      # than behind a reference that only loads once a PR exists. Its
      # reasoning went to execute-rationale.md, which this gate skips, so the
      # window carries the rule alone. Measured 34904; 35600 is ~2.0%,
      # matching the convention above.
      - name: Check execute build-window footprint (budget 35600 tokens)
        shell: bash
        run: |
          bash count-tokens.sh github-workflow/skills/execute/SKILL.md \
            --exclude github-workflow/skills/execute/references/review-and-merge.md \
            --exclude github-workflow/skills/code-review/references/auto-merge.md \
            --budget 35600

      # Recalibrated from 45900: auto-merge.md's step 3a gained the branch for
      # an empty check rollup (the usual symptom of exhausted Actions billing,
      # which the old wording could never fire on because it required a failing
      # check to inspect), and Phase 8 gained the general-purpose-agent
      # fallback plus the self-review disclosure. Both are new decision paths,
      # not restatement, and the rationale for the latter went to
      # execute-rationale.md rather than into this window. Still after the PR
      # exists, so the build-window budget above is untouched.
      #
      # Recalibrated again from 47000: auto-merge.md gained step 3b, the merge
      # path for a project with no GitHub-visible pipeline, which is the third
      # distinct CI-gate outcome and not expressible as a variant of the other
      # two (3a-ii requires active workflows; 3b requires none). The prose that
      # only explains the setting went to review.config.template.md, which no
      # skill cites, so this window carries the decision procedure alone.
      # Measured 47058; 48000 is ~2.0%, matching the convention above.
      #
      # Recalibrated again from 48000: Phase 9 rewrote its fix/file steps
      # around the "Fix in scope, file out of scope" rule, Phase 8 now asks
      # each reviewer which side of the diff a finding sits on, and Phase 10
      # says why the auto-merge fallbacks that file are not exceptions to it.
      # That is routing every review finding, not restatement, and the
      # reasoning went to execute-rationale.md rather than into this window.
      # Measured 48376; 49400 is ~2.1%, matching the convention above.
      - name: Check execute whole-run footprint (budget 49400 tokens)
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/execute/SKILL.md --budget 49400

      # Recalibrated from 37000: the pinned-PR path, the read-only overrides,
      # and the sanctioned-caller carve-out in auto-merge.md are new. Measured
      # 37699; 38800 is ~2.9%.
      #
      # Recalibrated again from 38800: the same step 3b as above, plus the
      # setup question that decides the setting in review-config-guide.md.
      # Note the prior budget had already tightened to ~220 tokens of headroom
      # before this change, so the raise covers that drift as well as step 3b.
      # Measured 39910; 40700 is ~2.0%.
      # bulk-execute is the third orchestrator. It gets the same two-window
      # treatment as execute: a tight budget on the choose/plan/build window
      # (its own SKILL.md plus set-selection.md and bulk-finish.md, minus the
      # two references that only load once a PR exists) and a loose one on the
      # whole run. It reuses execute's review-and-merge.md rather than
      # restating it, which is why the loose budget lands close to execute's.
      # Measured 32550 and 46022; budgets are ~2.0% above each.
      - name: Check bulk-execute build-window footprint (budget 33200 tokens)
        shell: bash
        run: |
          bash count-tokens.sh github-workflow/skills/bulk-execute/SKILL.md             --exclude github-workflow/skills/execute/references/review-and-merge.md             --exclude github-workflow/skills/code-review/references/auto-merge.md             --budget 33200

      - name: Check bulk-execute whole-run footprint (budget 46950 tokens)
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/bulk-execute/SKILL.md --budget 46950

      - name: Check code-review skill footprint (budget 40700 tokens)
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/code-review/SKILL.md --budget 40700

      - name: Check description and body budgets (ratchet)
        shell: bash
        run: bash check-budgets.sh

      - name: Prove the budget gate rejects oversized files
        shell: bash
        run: bash check-budgets.sh --self-test

      - name: Report round-trip counts (informational)
        shell: bash
        run: |
          echo "--- execute workflow ---"
          bash count-roundtrips.sh --workflow execute
          echo ""
          echo "--- bulk-execute workflow ---"
          bash count-roundtrips.sh --workflow bulk-execute
          echo ""
          echo "--- pick workflow ---"
          bash count-roundtrips.sh --workflow pick
          echo ""

  validate-plugin-json:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required fields
        shell: bash
        run: |
          status=0
          for f in */\.claude-plugin/plugin.json; do
            plugin_dir=$(dirname "$(dirname "$f")")
            name=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))" < "$f")
            version=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" < "$f")
            desc=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('description',''))" < "$f")

            if [ -z "$name" ]; then
              echo "FAIL: $f missing 'name'"
              status=1
            fi
            if [ -z "$version" ]; then
              echo "FAIL: $f missing 'version'"
              status=1
            fi
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "FAIL: $f version '$version' is not valid semver"
              status=1
            fi
            if [ -z "$desc" ]; then
              echo "FAIL: $f missing 'description'"
              status=1
            fi
            # Reject keys the Claude Code plugin schema does not recognize.
            # Unknown keys (e.g. displayName, userConfig) make the plugin
            # fail to load in the CLI, even though the file is valid JSON.
            extra=$(python3 -c "import json,sys; allowed={'name','version','description','author','homepage','repository','license','keywords','commands','agents','hooks','skills','mcpServers'}; print(','.join(sorted(set(json.load(sys.stdin).keys())-allowed)))" < "$f")
            if [ -n "$extra" ]; then
              echo "FAIL: $f has unrecognized key(s): $extra — the Claude Code plugin schema rejects these and the plugin will fail to load"
              status=1
            fi
            echo "OK: $plugin_dir ($name@$version)"
          done
          exit $status
