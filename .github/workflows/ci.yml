name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sync-check:
    name: Verify shared skills are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync verification
        shell: bash
        run: bash sync-skills.sh --verify

  lint-skills:
    name: Lint skill metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run skill linter
        shell: bash
        run: bash lint-skills.sh

  decision-logic-tests:
    name: Test workflow decision logic and wf.py I/O shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the offline test suite
        shell: bash
        # Discovery runs every tests/test_*.py module: the pure decision-logic
        # suite plus the wf.py I/O-shell integration tests.
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  version-bump-check:
    name: Check plugin versions are bumped
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bumps for changed plugins
        shell: bash
        run: |
          status=0
          base="${{ github.event.pull_request.base.sha }}"
          for plugin in github-workflow local-workflow; do
            changed=$(git diff --name-only "$base"...HEAD -- "$plugin/" | grep -v '.claude-plugin/plugin.json' | head -1 || true)
            if [ -n "$changed" ]; then
              old_version=$(git show "$base:$plugin/.claude-plugin/plugin.json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
              new_version=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" < "$plugin/.claude-plugin/plugin.json")
              if [ "$old_version" = "$new_version" ]; then
                echo "FAIL: $plugin/ has changes but version is still $old_version — bump it in plugin.json"
                status=1
              else
                echo "OK: $plugin version bumped $old_version → $new_version"
              fi
            fi
          done
          exit $status

  footprint-check:
    name: Check instruction-token footprint budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Budget convention: each budget is the last measured footprint plus
      # ~2%. Lower it when a change shrinks a window; raise it only when a
      # change adds a decision the run has to carry, and say so in the commit.
      #
      # The orchestrators get two windows each. The build window excludes the
      # references that only load once a PR exists, so it protects the
      # pick/plan/build path that this gate was built for. The whole-run
      # window keeps the rest bounded. Raising the whole-run budget alone
      # would let the build window regrow unnoticed.
      # Raised from 19650 in the body-standard change: Phase 7 now carries the
      # fixed PR body shape (## Summary / ## Changes / ## Test plan, Closes #N
      # last) and the pointer to the standard behind it, which is a decision the
      # run has to make and could not make from the old "a section per
      # component" wording.
      - name: Check execute build-window footprint
        shell: bash
        run: |
          bash count-tokens.sh github-workflow/skills/execute/SKILL.md \
            --exclude github-workflow/skills/execute/references/review-and-merge.md \
            --exclude github-workflow/skills/code-review/references/auto-merge.md \
            --budget 20100

      - name: Check execute whole-run footprint
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/execute/SKILL.md --budget 33980

      - name: Check bulk-execute build-window footprint
        shell: bash
        run: |
          bash count-tokens.sh github-workflow/skills/bulk-execute/SKILL.md \
            --exclude github-workflow/skills/execute/references/review-and-merge.md \
            --exclude github-workflow/skills/code-review/references/auto-merge.md \
            --budget 22830

      - name: Check bulk-execute whole-run footprint
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/bulk-execute/SKILL.md --budget 37160

      - name: Check code-review skill footprint
        shell: bash
        run: bash count-tokens.sh github-workflow/skills/code-review/SKILL.md --budget 31270

      - name: Check description and body budgets (ratchet)
        shell: bash
        run: bash check-budgets.sh

      - name: Prove the budget gate rejects oversized files
        shell: bash
        run: bash check-budgets.sh --self-test

      - name: Report round-trip counts (informational)
        shell: bash
        run: |
          echo "--- execute workflow ---"
          bash count-roundtrips.sh --workflow execute
          echo ""
          echo "--- bulk-execute workflow ---"
          bash count-roundtrips.sh --workflow bulk-execute
          echo ""
          echo "--- pick workflow ---"
          bash count-roundtrips.sh --workflow pick
          echo ""

  validate-plugin-json:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required fields
        shell: bash
        run: |
          status=0
          for f in */\.claude-plugin/plugin.json; do
            plugin_dir=$(dirname "$(dirname "$f")")
            name=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))" < "$f")
            version=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" < "$f")
            desc=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('description',''))" < "$f")

            if [ -z "$name" ]; then
              echo "FAIL: $f missing 'name'"
              status=1
            fi
            if [ -z "$version" ]; then
              echo "FAIL: $f missing 'version'"
              status=1
            fi
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "FAIL: $f version '$version' is not valid semver"
              status=1
            fi
            if [ -z "$desc" ]; then
              echo "FAIL: $f missing 'description'"
              status=1
            fi
            # Reject keys the Claude Code plugin schema does not recognize.
            # Unknown keys (e.g. displayName, userConfig) make the plugin
            # fail to load in the CLI, even though the file is valid JSON.
            extra=$(python3 -c "import json,sys; allowed={'name','version','description','author','homepage','repository','license','keywords','commands','agents','hooks','skills','mcpServers'}; print(','.join(sorted(set(json.load(sys.stdin).keys())-allowed)))" < "$f")
            if [ -n "$extra" ]; then
              echo "FAIL: $f has unrecognized key(s): $extra — the Claude Code plugin schema rejects these and the plugin will fail to load"
              status=1
            fi
            echo "OK: $plugin_dir ($name@$version)"
          done
          exit $status

      - name: Check the marketplace manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys

          MARKET_KEYS = {'name', 'owner', 'metadata', 'plugins'}
          ENTRY_KEYS = {'name', 'source', 'description', 'version', 'author',
                        'homepage', 'repository', 'license', 'category',
                        'keywords', 'strict'}

          status = 0
          failed = 0
          def fail(msg):
              global status, failed
              print('FAIL: ' + msg)
              status = 1
              failed += 1

          path = '.claude-plugin/marketplace.json'
          market = json.load(open(path, encoding='utf-8'))

          for key in ('name', 'owner', 'plugins'):
              if not market.get(key):
                  fail(f'{path} missing {key!r}')

          extra = sorted(set(market) - MARKET_KEYS)
          if extra:
              fail(f'{path} has unrecognized key(s): {", ".join(extra)} - Claude Code ignores these at load time')

          listed = set()
          for entry in market.get('plugins', []):
              before = failed
              name = entry.get('name', '')
              source = entry.get('source', '')
              if not name or not source or not entry.get('description'):
                  fail(f'{path} entry {name or "<unnamed>"} needs name, source and description')
                  continue
              listed.add(name)

              extra = sorted(set(entry) - ENTRY_KEYS)
              if extra:
                  fail(f'{path} entry {name} has unrecognized key(s): {", ".join(extra)}')

              manifest = os.path.join(source, '.claude-plugin', 'plugin.json')
              if not os.path.isfile(manifest):
                  fail(f'{path} entry {name} points at {source}, which has no plugin.json')
                  continue

              declared = json.load(open(manifest, encoding='utf-8')).get('name', '')
              if declared != name:
                  fail(f'{path} entry {name} points at a plugin that calls itself {declared!r} - an install would resolve nothing')

              # A version here would be a second source of truth that goes stale
              # the moment plugin.json is bumped without it.
              if 'version' in entry:
                  fail(f'{path} entry {name} carries a version; versions live in {manifest} alone')

              if failed == before:
                  print(f'OK: {name} -> {source}')

          on_disk = {d for d in os.listdir('.')
                     if os.path.isfile(os.path.join(d, '.claude-plugin', 'plugin.json'))}
          for missing in sorted(on_disk - listed):
              fail(f'{missing} ships a plugin.json but is not listed in {path}, so nobody can install it')

          sys.exit(status)
          PY

