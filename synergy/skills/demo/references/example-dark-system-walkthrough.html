<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Operations Hub</title>
<!--
  One worked example of a one-screen walkthrough demo: a dark system walkthrough.
  Study it and borrow techniques from it. Do not copy it and refill it: give each
  new demo its own palette, type, layout and diagram style.
  All names and figures below are invented.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a16; --surface:#0d1426; --surface2:#121b33; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#eaf0fb; --muted:#8a96b2; --faint:#8591ad;
  --teal:#3ddbc8; --blue:#6f8dff; --violet:#a98bff; --gold:#f2c66d; --rose:#f47aa8; --green:#5fd69a;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);
  background-image:radial-gradient(1200px 600px at 70% -10%,rgba(111,141,255,.16),transparent 60%),radial-gradient(900px 500px at 0% 100%,rgba(61,219,200,.08),transparent 60%);
  -webkit-font-smoothing:antialiased}

/* ---------- one-screen layout ---------- */
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.wrap{flex:1;min-height:0;width:100%;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;padding:16px 24px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:600}
h1{margin:4px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--muted);font-weight:500}
.howto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.howto kbd{font:inherit;font-size:11px;font-weight:600;color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.howto i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(61,219,200,.18)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:minmax(0,1fr);align-items:stretch;gap:16px}
.canvas{background:linear-gradient(180deg,var(--surface),#0a1122);border:1px solid var(--line);border-radius:22px;padding:10px;position:relative;overflow:hidden;display:flex;min-height:0}
.canvas::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.35;mask-image:radial-gradient(circle at 60% 45%,#000,transparent 75%);pointer-events:none}
.scroll{flex:1;min-height:0;display:flex}
svg#map,svg#arch{display:block;width:100%;height:100%;min-width:0;position:relative}
#map text,#arch text{font-family:Inter,"Segoe UI",sans-serif}

/* diagram focus and motion */
#map [data-g]{transition:opacity .45s ease}
#map .dim{opacity:.12}
#map .hit{cursor:pointer}
#map .glow,#arch .glow{animation:glow 1.4s ease-out}
@keyframes glow{0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}30%{filter:drop-shadow(0 0 14px rgba(242,198,109,.9))}100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}}
.spin{animation:spin 60s linear infinite;transform-origin:790px 300px}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:790px 300px}
@keyframes pulse{50%{transform:scale(1.04);opacity:.85}}
.src-pill rect{transition:fill .2s,stroke .2s}
.src-pill:hover rect,.src-pill.sel rect{fill:#18244a;stroke:var(--teal)}

/* right panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 22px;min-height:0;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:600}
.panel h2{font-size:22px;line-height:1.15;letter-spacing:-.015em;margin:8px 0;font-weight:700}
.panel p.lead{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.inset{margin-top:6px;flex:1;display:flex;flex-direction:column;gap:6px}
.inset-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:border-color .2s,background .2s}
.row:hover,.row.sel{border-color:var(--line2);background:#17213f}
.row.static{cursor:default}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:13.5px;font-weight:600}
.row .t small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid}
.tag.teal{color:var(--teal);border-color:rgba(61,219,200,.35);background:rgba(61,219,200,.08)}
.tag.blue{color:var(--blue);border-color:rgba(111,141,255,.35);background:rgba(111,141,255,.08)}
.tag.gold{color:var(--gold);border-color:rgba(242,198,109,.35);background:rgba(242,198,109,.08)}
.tag.grey{color:var(--muted);border-color:var(--line2)}
.tag.rose{color:var(--rose);border-color:rgba(244,122,168,.35);background:rgba(244,122,168,.08)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);flex:none}
.ico svg{width:18px;height:18px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin-top:6px}
.btn{font:inherit;font-size:13px;font-weight:600;color:#08101f;background:linear-gradient(120deg,var(--teal),#7fe9da);border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line2)}
.btn[disabled]{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;font-weight:500;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;cursor:pointer}
.chip.sel{border-color:var(--teal);color:var(--teal)}
.answer{background:linear-gradient(180deg,#141f3d,#101a33);border:1px solid var(--line2);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.55}
.answer .q{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.answer .src{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}
.stg{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);transition:all .3s}
.stg i{display:grid;place-items:center;width:22px;height:22px;margin:0 auto 4px;border-radius:50%;border:1px solid var(--line2);font-style:normal;font-weight:700;color:var(--faint)}
.stg.done{border-color:rgba(61,219,200,.4);color:var(--text)}
.stg.done i{background:var(--teal);border-color:var(--teal);color:#08101f}
.stg.cur{border-color:var(--gold);color:var(--text)}
.stg.cur i{border-color:var(--gold);color:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px}
.tile .ico{margin-bottom:6px;width:30px;height:30px}
.tile b{display:block;font-size:13.5px}
.tile small{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}
.tag.off{color:var(--faint);border-color:var(--line);text-decoration:line-through}

/* access matrix with a pending change and a sync bar */
.mx{display:grid;grid-template-columns:118px repeat(3,30px);align-items:center;row-gap:5px;font-size:12px}
.mx .hd{height:46px;position:relative}
.mx .hd span{position:absolute;left:12px;bottom:2px;transform:rotate(-55deg);transform-origin:left bottom;white-space:nowrap;font-size:10.5px;color:var(--muted);font-weight:500}
.mx .who{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.cell{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);cursor:pointer;padding:0;transition:all .2s}
.cell:hover{border-color:var(--teal)}
.cell.on{background:rgba(61,219,200,.85);border-color:var(--teal)}
.cell.pend{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,198,109,.25)}
.cell.on.pend{background:rgba(242,198,109,.85)}
.cell:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sync{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12.5px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:none;box-shadow:0 0 0 4px rgba(61,219,200,.15)}
.sync.busy .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(242,198,109,.18)}
.sync .t{flex:1;min-width:0;line-height:1.35}
.sync small{display:block;color:var(--muted);font-size:11.5px}
.pbar{height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal))}

/* small data table: rows a person cannot see are struck through */
table.dt{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dt th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);text-align:left;padding:6px 8px;font-weight:600}
.dt td{padding:5px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;transition:opacity .3s}
.dt tr.no td{color:var(--faint);opacity:.45;text-decoration:line-through}
.dt tr.yes td:first-child{color:var(--teal);font-weight:600}
.chart{max-height:190px}
.chart text{font-family:Inter,sans-serif}
.bar{transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* step bar */
.stepbar{position:relative;display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.steps{flex:1;display:flex;align-items:center;min-width:0}
.sb{flex:1;display:flex;align-items:center;gap:8px;font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;min-width:0}
.sb .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--line2);flex:none;color:var(--faint);background:var(--bg);transition:all .25s}
.sb .nm{font-size:13px;font-weight:600;white-space:nowrap}
.sb::after{content:"";flex:1;height:1px;background:var(--line2);min-width:6px}
.sb:last-child::after{display:none}
.sb:hover{color:var(--text)}
.sb.seen .num{border-color:rgba(61,219,200,.5);color:var(--teal)}
.sb.on{color:var(--text);flex-grow:1.9}
.sb.on .num{background:var(--teal);border-color:var(--teal);color:#08101f;box-shadow:0 0 0 4px rgba(61,219,200,.18)}
.stepbar .btn{flex:none;white-space:nowrap;padding:10px 16px}

/* view switch and architecture */
.viewsw{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.vs{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:9px;padding:7px 14px;cursor:pointer}
.vs.on{background:linear-gradient(120deg,var(--teal),#7fe9da);color:#08101f}
[hidden]{display:none!important}
#arch .node{cursor:pointer}
#arch .node rect.b{transition:stroke .2s,fill .2s}
#arch .node:hover rect.b{fill:#18244a}
#arch .node.sel rect.b{stroke:var(--gold);stroke-width:2}
#arch .lk{transition:opacity .3s,stroke .3s}
#arch.focus .lk{opacity:.12}
#arch.focus .lk.on{opacity:1;stroke:rgba(242,198,109,.75)}
#arch.focus .node{opacity:.35;transition:opacity .3s}
#arch.focus .node.on,#arch.focus .node.sel{opacity:1}
.dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px;line-height:1.45;margin:14px 0 4px}
.dl dt{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0;color:var(--text)}
.ctrl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ctrl li{font-size:12.5px;line-height:1.4;color:var(--muted);padding-left:16px;position:relative}
.ctrl li::before{content:"";position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
body.arch .stepbar .steps,body.arch .stepbar .btn{visibility:hidden}
.archhint{display:none;position:absolute;left:0;right:0;margin:0;text-align:center;font-size:13px;color:var(--muted)}
body.arch .archhint{display:block}

/* focus */
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.sb:focus-visible,.vs:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#map [role=button]:focus{outline:none}
#map [role=button]:focus-visible,#arch .node:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* compact: short screens */
@media(max-width:1500px){.sb .nm{display:none}.sb.on .nm{display:inline}}
@media(max-height:860px){
  .panel{padding:16px 20px}
  .panel h2{font-size:19px;margin:6px 0}
  .panel p.lead{font-size:13px;line-height:1.45}
  .stats{margin:10px 0 8px}
  .stat{padding:7px 9px;display:flex;align-items:baseline;gap:7px}
  .stat .n{font-size:18px;flex:none}
  .stat .l{font-size:11px;margin:0}
  .row{padding:7px 10px}.row .t small{font-size:11.5px}
  .note{font-size:12px;line-height:1.4}
  .tile{padding:8px 10px}.tile .ico{display:none}.tile small{font-size:11.5px}
  .stg{padding:6px 4px;font-size:11.5px}
  .chart{max-height:160px}
  .answer{font-size:13px;padding:10px}
}
@media(max-height:760px){
  .wrap{padding:10px 20px 14px}
  header{margin-bottom:8px}
  h1{font-size:20px;margin-top:2px}
  .grid{gap:12px}
  .stepbar{margin-top:8px;padding:5px}
  .stepbar .btn{padding:8px 14px}
  .panel{padding:12px 16px}
  .panel h2{font-size:17px;margin:4px 0}
  .panel p.lead{font-size:12.5px;line-height:1.4}
  .stat .n{font-size:16px}
  .stat .l{font-size:10.5px;line-height:1.25}
  .row{padding:5px 9px;gap:9px}
  .ico{width:26px;height:26px;border-radius:8px}.ico svg{width:15px;height:15px}
  .chart{max-height:130px}
  .chip{padding:4px 10px;font-size:11.5px}
  .dt td{padding:3px 8px}
  .cell{width:20px;height:20px}
}
/* fallback: narrow or very short screens scroll normally */
@media(max-width:1100px),(max-height:600px){
  body{height:auto;overflow:auto}
  .grid{grid-template-columns:1fr}
  .panel{overflow:visible}
  .scroll{overflow-x:auto}
  svg#map,svg#arch{min-width:760px;height:auto}
  .sb .nm{display:none}.sb.on .nm{display:inline}
  .howto{display:none}
}
@media(max-width:640px){.wrap{padding:18px 16px}h1{font-size:22px}.panel{padding:18px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">Operations · Proposal</div>
      <h1>The Operations Hub <span>· one place for what the team knows</span></h1>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="howto"><i></i><span id="howtoText">Select any part of the diagram, or use <kbd>←</kbd> <kbd>→</kbd></span></div>
      <div class="viewsw" role="tablist" aria-label="View">
        <button role="tab" class="vs on" data-view="tour" aria-selected="true">How it works</button>
        <button role="tab" class="vs" data-view="arch" aria-selected="false">Architecture</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <div class="canvas">
      <div class="scroll" id="mapWrap">
<svg id="map" viewBox="0 0 1200 680" role="group" aria-label="Diagram: how the Operations Hub works. Sources flow into the intake store, then the check, then the hub, then the outcomes. Guardrails run along the bottom.">
  <defs>
    <radialGradient id="coreG" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#9fb2ff"/><stop offset=".55" stop-color="#5b6fe0"/><stop offset="1" stop-color="#2a2f7a"/></radialGradient>
    <radialGradient id="haloG"><stop offset="0" stop-color="#6f8dff" stop-opacity=".35"/><stop offset="1" stop-color="#6f8dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#101932"/></linearGradient>
    <linearGradient id="storeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123a44"/><stop offset="1" stop-color="#0e2030"/></linearGradient>
  </defs>

  <!-- column headers: decoration, the group label already names the columns -->
  <g font-size="11" font-weight="600" letter-spacing="2" fill="#8591ad" aria-hidden="true">
    <text x="40" y="44">SOURCES</text><text x="300" y="44">INTAKE</text><text x="512" y="44">CHECK</text><text x="700" y="44">THE HUB</text><text x="1000" y="44">OUTCOMES</text>
  </g>

  <g id="paths" fill="none" stroke-linecap="round" aria-hidden="true"></g>
  <g id="particles" aria-hidden="true"></g>

  <!-- sources: built from SOURCES in the script -->
  <g id="sources"></g>

  <!-- intake store -->
  <g data-g="store" class="hit" data-go="1">
    <rect x="300" y="244" width="150" height="132" rx="18" fill="url(#storeG)" stroke="rgba(61,219,200,.45)"/>
    <g transform="translate(355 262)" stroke="#3ddbc8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="36" height="10" rx="3"/><rect x="2" y="17" width="36" height="10" rx="3"/><rect x="2" y="30" width="36" height="10" rx="3"/><path d="M16 9h8M16 22h8M16 35h8"/></g>
    <text x="375" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#eaf0fb">Intake store</text>
    <text x="375" y="345" text-anchor="middle" font-size="11.5" fill="#8a96b2">Locked area</text>
    <text x="375" y="361" text-anchor="middle" font-size="11.5" fill="#8a96b2">Add-only</text>
  </g>

  <!-- check gate -->
  <g data-g="gate" class="hit" data-go="2">
    <rect x="530" y="280" width="60" height="60" rx="12" transform="rotate(45 560 310)" fill="url(#cardG)" stroke="rgba(111,141,255,.6)"/>
    <path d="M547 298h26l-10 12v10l-6 3v-13z" fill="none" stroke="#6f8dff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"/>
    <text x="560" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#eaf0fb">Check</text>
    <text x="560" y="389" text-anchor="middle" font-size="11.5" fill="#8a96b2">Only way into</text>
    <text x="560" y="404" text-anchor="middle" font-size="11.5" fill="#8a96b2">the hub</text>
  </g>

  <!-- trust orbit: a slow spinning ring of people around the hub -->
  <g data-g="trust" class="hit" data-go="4">
    <circle cx="790" cy="300" r="150" fill="url(#haloG)"/>
    <g class="spin" aria-hidden="true"><circle cx="790" cy="300" r="142" fill="none" stroke="rgba(242,198,109,.35)" stroke-dasharray="2 7"/><g id="people"></g></g>
    <text x="790" y="478" text-anchor="middle" font-size="12" font-weight="600" fill="#f2c66d">Trust · per person, per subject</text>
  </g>

  <!-- the hub -->
  <g data-g="hub" class="hit" data-go="3">
    <g transform="rotate(180 790 300)" fill="none" stroke-width="16">
      <circle id="arcShared" cx="790" cy="300" r="95" stroke="#3ddbc8" stroke-dasharray="290 600"/>
      <circle id="arcTeam" cx="790" cy="300" r="95" stroke="#a98bff" stroke-dasharray="130 600" stroke-dashoffset="-302"/>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}

/* ---------- icons (24x24 stroke paths) ---------- */
const ICON={
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  chat:'<path d="M4 5h16v10H10l-6 4z"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  market:'<path d="M3 20h18"/><path d="M4 16l5-6 4 3 7-8"/><path d="M16 5h4v4"/>',
  app:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 13h10M7 16h6"/>',
  docs:'<path d="M8 3h11v14H8z"/><path d="M5 7v14h11"/>',
  noEdit:'<circle cx="12" cy="12" r="9"/><path d="M6 18L18 6"/>',
  out:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  split:'<rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/>',
  erase:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 14c3 0 6 2 6 5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
  book:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z"/>'
};
const ico=(k,c='#8a96b2')=>`<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* ---------- diagram: sources, paths, guardrails ---------- */
const SOURCES=[
  ['Email','mail','Team mailboxes'],['Chat','chat','Messages and channels'],['Meetings','mic','Transcripts'],
  ['Market data','market','Prices and events'],['Operations app','app','Requests and reports'],['Documents','docs','Files and decks']];
const PATHS=[];
function addPath(d,g,color,speed=.12,n=2){
  const p=sv('path',{d,stroke:'rgba(255,255,255,.10)','stroke-width':1.5,'data-g':g},$('#paths'));
  PATHS.push({p,g,color,speed,n,len:0});return p;
}
SOURCES.forEach(([name,k],i)=>{
  const y=90+i*80,cy=y+23;
  const g=sv('g',{class:'src-pill hit','data-g':'src','data-src':i},$('#sources'));
  sv('rect',{x:40,y,width:196,height:46,rx:23,fill:'#111a33',stroke:'rgba(255,255,255,.12)'},g);
  const ig=sv('g',{transform:`translate(54 ${y+11})`,fill:'none',stroke:'#3ddbc8','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'},g);ig.innerHTML=ICON[k];
  const t=sv('text',{x:88,y:cy+5,'font-size':14,'font-weight':600,fill:'#eaf0fb'},g);t.textContent=name;
  addPath(`M236 ${cy} C 272 ${cy}, 262 310, 300 310`,'src store','#3ddbc8',.07+i*.004,1);
});
addPath('M450 310 L 518 310','store gate','#3ddbc8',.10,2);
addPath('M602 310 C 640 310, 660 300, 690 300','gate hub','#6f8dff',.10,2);
addPath('M886 266 C 945 232, 950 164, 1000 164','hub ask','#a98bff',.10,2);
addPath('M886 334 C 945 352, 955 323, 1000 323','hub prop','#f2c66d',.09,2);
addPath('M1086 356 L1086 386','prop','#f2c66d',.08,1);
addPath('M1086 452 L1086 482','prop','#5fd69a',.08,1);
addPath('M630 510 C 690 510, 700 420, 728 372','access hub','#a98bff',.08,1);

/* people on the trust orbit (decoration inside the spinning group) */
[[-65],[-25],[20],[160],[205],[250]].forEach(([a])=>{
  const x=790+142*Math.cos(a*Math.PI/180),y=300+142*Math.sin(a*Math.PI/180);
  sv('circle',{cx:x,cy:y,r:11,fill:'#0d1426',stroke:'#f2c66d','stroke-width':1.5},$('#people'));
  const g=sv('g',{transform:`translate(${x-7} ${y-7}) scale(.58)`,fill:'none',stroke:'#f2c66d','stroke-width':2.2},$('#people'));g.innerHTML=ICON.user;
});

/* access data (invented). USERS is live; SAVED holds edits that are still syncing */
const FUNDS=['A','B','C'];
const USERS=[{n:'Analyst',f:['A']},{n:'Treasury lead',f:['A','B']},{n:'Risk officer',f:['A','B','C']},{n:'New joiner',f:[]}];
const SAVED=USERS.map(u=>({f:[...u.f]}));
let who=0;
/* the mini matrix in the diagram mirrors USERS */
function paintMini(){const mm=$('#miniMx');mm.innerHTML='';
  USERS.forEach((u,i)=>{const y=462+i*24;
    sv('rect',{x:470,y:y+4,width:46,height:7,rx:3.5,fill:'rgba(255,255,255,.14)'},mm);
    FUNDS.forEach((f,j)=>{const v=u.f.includes(f);sv('rect',{x:530+j*24,y,width:16,height:16,rx:4,fill:v?'rgba(61,219,200,.8)':'#0b1224',stroke:v?'#3ddbc8':'rgba(255,255,255,.16)'},mm)})})}
paintMini();

const RAILS=[
  ['noEdit','Read-only chat','The chat answers questions. It cannot change anything.'],
  ['out','Nothing leaves','No data leaves the team without approval.'],
  ['split','Clients kept apart','Data for Fund A is never used for Fund B.'],
  ['erase','2-person erasure','Recorded. It removes the item and everything built from it.'],
  ['lock','Logged access','Every read of the intake store is logged.'],
  ['people','2 approvers','No one approves their own request.']];
RAILS.forEach(([k,t],i)=>{const x=40+i*190;const g=sv('g',{},$('#rails'));
  sv('rect',{x,y:628,width:178,height:40,rx:20,fill:'#0f1730',stroke:'rgba(244,122,168,.35)'},g);
  const ig=sv('g',{transform:`translate(${x+14} 638) scale(.85)`,fill:'none',stroke:'#f47aa8','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'},g);ig.innerHTML=ICON[k];
  const tx=sv('text',{x:x+40,y:653,'font-size':12,'font-weight':600,fill:'#eaf0fb'},g);tx.textContent=t;});

/* ---------- particles along the paths ---------- */
PATHS.forEach(o=>{o.len=o.p.getTotalLength();o.dots=[];
  for(let i=0;i<o.n;i++){const c=sv('circle',{r:3,fill:o.color,'data-g':o.g,opacity:.9},$('#particles'));o.dots.push({c,off:i/o.n+Math.random()*.2})}});
const t0=performance.now();
function tick(now){const t=(now-t0)/1000;
  PATHS.forEach(o=>o.dots.forEach(d=>{const f=((t*o.speed)+d.off)%1;const pt=o.p.getPointAtLength(f*o.len);d.c.setAttribute('cx',pt.x);d.c.setAttribute('cy',pt.y);d.c.setAttribute('opacity',Math.sin(f*Math.PI)*.95)}));
  requestAnimationFrame(tick)}
if(!RM)requestAnimationFrame(tick);else PATHS.forEach(o=>o.dots.forEach(d=>d.c.remove()));

function flash(sel){document.querySelectorAll(sel).forEach(n=>{n.classList.remove('glow');void n.getBoundingClientRect();n.classList.add('glow')})}

/* ---------- example data (invented) ---------- */
const SORT=[
  {from:'Email · Operations',text:'Fund A settlement moved to Thursday',to:'Shared',c:'teal',hl:'#arcShared',why:'Useful team knowledge. It passes the check into the shared part of the hub.'},
  {from:'Chat',text:'Anyone for lunch on Friday?',to:'Stays locked',c:'grey',hl:'[data-g="store"]',why:'Not team knowledge. It stays in the intake store and is never shared.'},
  {from:'Operations app · Analyst',text:'Show Broker 1 first in my reports',to:'Team',c:'blue',hl:'#arcTeam',why:'A team preference. Only that team sees it.'},
  {from:'Operations app · Head of operations',text:'From today, the cut-off is 15:00',to:'Needs approval',c:'gold',hl:'[data-g="prop"]',why:'A rule changes only by approval. It becomes a request for at least 2 approvers.'}];
const QA=[
  ['When does Fund A settle?','Thursday. Operations moved it in an email on 3 March.',[['Shared','teal'],['Operations email · 3 Mar','grey']]],
  ['Who is late most?','Broker 2 was late on 4 of 20 days last month. Broker 1 was late on 1.',[['Shared','teal'],['Settlement report','grey']]],
  ['Change the cut-off','I cannot change anything. A change is a request, and at least 2 approvers decide.',[['Chat is read-only','rose']]]];
const SETTLE=[['A','Broker 1','Thu','On time'],['B','Broker 2','Fri','Late'],['C','Broker 1','Mon','On time'],['B','Broker 3','Tue','On time']];
const GAPS=[
  ['Where answers come from','Each tool, searched by hand','One hub, with sources shown'],
  ['Who sees what','Whoever has the file','The access list, on every question'],
  ['How rules change','By email, not recorded','A request with 2 approvers'],
  ['Who to trust','Whoever is loudest','A record of who flagged it first']];
const fundList=f=>f.length?f.map(x=>'Fund '+x).join(', '):'no funds';
function userChips(){return `<div class="chips" id="uchips">${USERS.map((u,i)=>`<button class="chip${i===who?' sel':''}" data-u="${i}">${u.n}</button>`).join('')}</div>`}
function bindUsers(p,cb){p.querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>{who=+c.dataset.u;p.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('sel',+x.dataset.u===who));cb()})}

/* access matrix: a select marks a pending change, the sync bar makes it live */
let pend=new Set(),syncTimer=null;
function renderMx(){const m=$('#mx');if(!m)return;
  let h=`<div></div>${FUNDS.map(f=>`<div class="hd"><span>Fund ${f}</span></div>`).join('')}`;
  USERS.forEach((u,i)=>{const s=SAVED[i];h+=`<div class="who">${u.n}</div>`;
    FUNDS.forEach(f=>{const k=i+'|'+f,on=s.f.includes(f);h+=`<button class="cell${on?' on':''}${pend.has(k)?' pend':''}" data-k="${k}" aria-label="${u.n}: Fund ${f}" aria-pressed="${on}"></button>`})});
  m.innerHTML=h;m.querySelectorAll('.cell').forEach(c=>c.onclick=()=>toggleCell(c.dataset.k))}
function toggleCell(k){const [i,f]=k.split('|'),s=SAVED[+i].f,at=s.indexOf(f);if(at>=0)s.splice(at,1);else s.push(f);
  if(s.includes(f)===USERS[+i].f.includes(f))pend.delete(k);else pend.add(k);
  renderMx();flash('[data-g="access"]');startSync();$('[data-k="'+k+'"]').focus()}
function startSync(){clearInterval(syncTimer);const el=$('#sync');if(!el)return;if(!pend.size){finishSync(true);return}
  el.classList.add('busy');$('#syncT').textContent='Saved. The access list is updating.';$('#syncS').textContent='About 1 minute in real life. Shortened here.';
  const t=performance.now(),dur=RM?0:2400;
  syncTimer=setInterval(()=>{const k=dur?Math.min(1,(performance.now()-t)/dur):1;const pb=$('#pb');if(pb)pb.style.width=(k*100)+'%';if(k>=1){clearInterval(syncTimer);finishSync(false)}},60)}
function finishSync(quiet){USERS.forEach((u,i)=>u.f=[...SAVED[i].f]);pend.clear();paintMini();
  const el=$('#sync');if(!el)return;el.classList.remove('busy');
  $('#syncT').textContent=quiet?'The access list matches':'Live';$('#syncS').textContent=quiet?'Every question is checked against it.':'The next question uses the new access. See step 6.';
  const pb=$('#pb');if(pb)pb.style.width=quiet?'0%':'100%';renderMx();if(!quiet)flash('[data-g="access"]')}

/* trust-style chart: a timeline and animated bars, role="img" with the full story in its label */
function trustChart(){
  return `<svg class="chart" viewBox="0 0 330 190" width="100%" role="img" aria-label="Trust example for the subject settlement delays. Before a delay: the trader raised a false alarm 2 months before; the analyst raised it 6 weeks early; the strategist raised it 1 day early. Result: the analyst gets a strong increase in trust, the strategist a small increase, and the trader a lower score.">
  <line x1="10" y1="40" x2="320" y2="40" stroke="rgba(255,255,255,.15)"/>
  <line x1="290" y1="14" x2="290" y2="52" stroke="#f47aa8" stroke-dasharray="3 3"/><text x="290" y="10" text-anchor="middle" font-size="10" fill="#f47aa8">Delay</text>
  <circle cx="40" cy="40" r="5" fill="#0d1426" stroke="#8a96b2"/><path d="M36 36l8 8M44 36l-8 8" stroke="#f47aa8" stroke-width="1.6"/><text x="40" y="60" text-anchor="middle" font-size="10.5" fill="#c3cbdd">Trader</text><text x="40" y="71" text-anchor="middle" font-size="10" fill="#a3adc4">false alarm</text>
  <circle cx="150" cy="40" r="5" fill="#3ddbc8"/><text x="150" y="60" text-anchor="middle" font-size="10.5" fill="#c3cbdd">Analyst</text><text x="150" y="71" text-anchor="middle" font-size="10" fill="#a3adc4">6 weeks early</text>
  <circle cx="282" cy="40" r="5" fill="#6f8dff"/><text x="250" y="60" text-anchor="middle" font-size="10.5" fill="#c3cbdd">Strategist</text><text x="250" y="71" text-anchor="middle" font-size="10" fill="#a3adc4">1 day early</text>
  ${[['Analyst','#3ddbc8',230,'+ strong'],['Strategist','#6f8dff',120,'+ small'],['Trader','#f47aa8',50,'− lower']].map((r,i)=>`
   <text x="10" y="${106+i*30}" font-size="11" fill="#eaf0fb">${r[0]}</text>
   <rect x="100" y="${96+i*30}" width="160" height="12" rx="6" fill="rgba(255,255,255,.05)"/>
   <rect class="bar" data-w="${r[2]*160/230}" x="100" y="${96+i*30}" width="0" height="12" rx="6" fill="${r[1]}"/>
   <text x="268" y="${106+i*30}" font-size="11" fill="${r[1]}">${r[3]}</text>`).join('')}
  </svg>`;
}

function animateBars(){document.querySelectorAll('.bar').forEach(b=>{const w=+b.dataset.w;if(RM){b.setAttribute('width',w);return}
  let s=null;const f=n=>{s??=n;const k=Math.min(1,(n-s)/900),e=1-Math.pow(1-k,3);b.setAttribute('width',w*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
  flash('[data-g="trust"]')}

/* ---------- steps ---------- */
const STEPS=[
{tab:'Overview',g:null,kicker:'Overview',
 h:'One place for what the team knows',
 lead:'Today each tool keeps its own records. The hub joins them, answers questions, and changes nothing without approval.',
 stats:[['6','source types flow in'],['1','shared hub'],['2+','approvers per change']],

{tab:'Capture',g:['src','store'],kicker:'01 · Capture',
 h:'It captures what the team sees and says',
 lead:'Each item is saved in a locked intake store. Items are only added, never overwritten.',
 stats:[['6','source types'],['0','overwrites'],['1','recorded way to erase']],
 body(){return `<div class="inset-title">Sources · select one here or in the diagram</div><div class="chips">`+SOURCES.map(([n],i)=>`<button class="chip" data-src="${i}">${n}</button>`).join('')+`</div>
  <div class="row static" id="srcDetail" style="margin-top:6px"></div>`},
 mount(){selSource(0)}},
{tab:'Check',g:['store','gate','hub'],kicker:'02 · Check',
 h:'Only checked items are shared',
 lead:'Everything captured stays locked. The check is the only way into the hub.',
 stats:[['1','way into the hub'],['0','chat messages shared'],['100%','kept locked']],
 body(){return `<div class="inset-title">Example items · select one</div>`+SORT.map((s,i)=>`<button class="row" data-i="${i}"><span class="t"><b>${s.text}</b><small>${s.from}</small></span><span class="tag ${s.c}">${s.to}</span></button>`).join('')+`<div class="note" id="sortNote">Select an item to see where it goes.</div>`},
 mount(p){p.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>{p.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');const s=SORT[+r.dataset.i];$('#sortNote').textContent=s.why;flash(s.hl)})}},
{tab:'Hub',g:['hub','gate'],kicker:'03 · The hub',
 h:'3 parts, each with its own owner',
 lead:'The shared part is for everyone. The team part is for 1 team. Rules change only by approval.',
 stats:[['3','parts'],['1','team per team part'],['0','rule changes without approval']],
 body(){return `<div class="inset-title">Select a part</div>
  <button class="row" data-a="#arcShared"><span class="ico">${ico('people','#3ddbc8')}</span><span class="t"><b>Shared</b><small>Filled only by the check. Everyone sees it through the chat.</small></span></button>

  <div class="note">Open: who owns the team part is still to be decided.</div>`},
 mount(p){p.querySelectorAll('[data-a]').forEach(r=>r.onclick=()=>{p.querySelectorAll('.row').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');flash(r.dataset.a)})}},
{tab:'Trust',g:['trust'],kicker:'04 · Trust',
 h:'Trust is earned, per person and per subject',
 lead:'After an event that mattered, the hub checks who raised it first and how early. A false alarm counts against a person.',
 stats:[['2','kinds: authority and earned'],['1st','scores from past events'],['0','power from a score']],

/* ---------- navigation ---------- */
const tabs=$('#tabs'),panel=$('#panel'),prevB=$('#prev'),nextB=$('#nxt');let cur=0;
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.className='sb';
  b.innerHTML=`<span class="num" aria-hidden="true">${i?i:'★'}</span><span class="nm">${s.tab}</span>`;
  b.setAttribute('aria-label',i?`Step ${i} of ${STEPS.length-1}: ${s.tab}`:'Overview');
  b.onclick=()=>go(i);tabs.appendChild(b)});
prevB.onclick=()=>go(cur-1);nextB.onclick=()=>go(cur+1);
function setHash(h){try{history.replaceState(null,'','#'+h)}catch(e){}}
function go(i){
  cur=(i+STEPS.length)%STEPS.length;const s=STEPS[cur];
  [...tabs.children].forEach((b,j)=>{b.classList.toggle('on',j===cur);if(j===cur)b.classList.add('seen');b.setAttribute('aria-current',j===cur?'step':'false')});
  prevB.disabled=cur===0;
  nextB.textContent=cur===STEPS.length-1?'Start again ↺':`Next: ${STEPS[cur+1].tab} →`;
  document.querySelectorAll('#map [data-g]').forEach(n=>{const gs=n.dataset.g.split(' ');n.classList.toggle('dim',!!s.g&&!gs.some(g=>s.g.includes(g)))});
  panel.innerHTML=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p>`+
    (s.stats?`<div class="stats">${s.stats.map(([n,l])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>`:'<div style="height:14px"></div>')+
    `<div class="inset">${s.body()}</div>`;
  panel.scrollTop=0;
  s.mount&&s.mount(panel);
  if(view==='tour')setHash(cur);
}
/* every diagram part with data-go becomes a named button that opens its step */
document.querySelectorAll('#map [data-go]').forEach(g=>{
  const n=+g.dataset.go,txt=[...g.querySelectorAll('text')].map(t=>t.textContent.trim()).filter(Boolean).join(', ');
  g.setAttribute('role','button');g.setAttribute('tabindex','0');
  g.setAttribute('aria-label',`${txt}. Opens step ${n}: ${STEPS[n].tab}.`);
  g.addEventListener('click',()=>go(n));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(n)}});
});
document.querySelectorAll('.src-pill').forEach(g=>{const s=SOURCES[+g.dataset.src];
  g.setAttribute('role','button');g.setAttribute('tabindex','0');
  g.setAttribute('aria-label',`Source: ${s[0]}. ${s[2]}. Opens step 1: ${STEPS[1].tab}.`);
  const f=()=>{if(cur!==1)go(1);selSource(+g.dataset.src)};
  g.addEventListener('click',e=>{e.stopPropagation();f()});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
addEventListener('keydown',e=>{if(e.target.closest('button,[role=button]')||view==='arch')return;
  if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1)});

const N={};NODES.forEach(n=>N[n.id]=n);
function anchor(a,b){const ca=[a.x+a.w/2,a.y+a.h/2],cb=[b.x+b.w/2,b.y+b.h/2];
  if(b.x>=a.x+a.w-2)return [[a.x+a.w,ca[1]],[b.x,cb[1]],'h'];
  if(a.x>=b.x+b.w-2)return [[a.x,ca[1]],[b.x+b.w,cb[1]],'h'];
  if(b.y>=a.y+a.h)return [[ca[0],a.y+a.h],[cb[0],b.y],'v'];
  return [[ca[0],a.y],[cb[0],b.y+b.h],'v'];}
let selected=null,view='tour';
function buildArch(){
  A.innerHTML=`<defs><linearGradient id="aCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#101932"/></linearGradient></defs>

  <rect x="918" y="62" width="272" height="420" rx="20" fill="rgba(242,198,109,.03)" stroke="rgba(242,198,109,.25)" stroke-dasharray="4 5" aria-hidden="true"/>
  <g id="aLinks" fill="none" stroke-linecap="round" aria-hidden="true"></g><g id="aDots" aria-hidden="true"></g><g id="aNodes"></g>`;
  const LG=$('#aLinks'),NG=$('#aNodes'),DG=$('#aDots'),al=[];
  LINKS.forEach(([f,t])=>{const [p,q,o]=anchor(N[f],N[t]);
    const d=o==='h'?`M${p[0]} ${p[1]} C ${(p[0]+q[0])/2} ${p[1]}, ${(p[0]+q[0])/2} ${q[1]}, ${q[0]} ${q[1]}`:`M${p[0]} ${p[1]} C ${p[0]} ${(p[1]+q[1])/2}, ${q[0]} ${(p[1]+q[1])/2}, ${q[0]} ${q[1]}`;
    const dash=N[t].dash?'4 4':'';
    const el=sv('path',{d,class:'lk',stroke:'rgba(255,255,255,.16)','stroke-width':1.4,'stroke-dasharray':dash,'data-f':f,'data-t':t},LG);
    if(!RM&&!dash){const c=sv('circle',{r:2.6,fill:COL[N[f].c]},DG);al.push({el,c,len:el.getTotalLength(),off:Math.random()})}});
  NODES.forEach(n=>{const g=sv('g',{class:'node','data-id':n.id,tabindex:0,role:'button','aria-label':`${n.t}${n.s.length?': '+n.s.join(', '):''}. ${n.what} Select for owner, links and controls.`},NG);
    sv('rect',{class:'b',x:n.x,y:n.y,width:n.w,height:n.h,rx:12,fill:n.c==='out'?'rgba(244,122,168,.06)':'url(#aCard)',stroke:n.c==='x'?'#ffffff':COL[n.c],'stroke-opacity':n.c==='x'?.14:.5,'stroke-dasharray':n.dash?'5 4':''},g);
    sv('rect',{x:n.x,y:n.y+12,width:3,height:Math.max(12,n.h-24),rx:1.5,fill:COL[n.c]},g);
    const tt=sv('text',{x:n.x+14,y:n.y+(n.s.length?22:n.h/2+5),'font-size':13,'font-weight':700,fill:'#eaf0fb'},g);tt.textContent=n.t;
    /* a node with pills shows them instead of its subtitle lines */

function hoverNode(id){

  A.querySelectorAll('.node').forEach(g=>g.classList.toggle('on',on.has(g.dataset.id)));
}
function selNode(id){selected=id;A.querySelectorAll('.node').forEach(g=>g.classList.toggle('sel',g.dataset.id===id));hoverNode(id);

function setView(v){view=v;
